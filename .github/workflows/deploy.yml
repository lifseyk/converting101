name: Deploy to Bluehost

on:
  push:
    branches: [main]
  # Lets you trigger a deploy manually from the Actions tab without a new commit
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      # Uploads the contents of ./out/ to the subdomain's document root on Bluehost.
      # Only changed files are transferred after the first run.
      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./out/
          # Change this to match the subdomain's actual document root in cPanel
          server-dir: /public_html/converting/
